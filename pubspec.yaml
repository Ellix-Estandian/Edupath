name: edupath
description: AI-Powered Educational Platform using Flutter + Supabase + Llama RAG
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Supabase
  supabase_flutter: ^2.9.1
  # State Management
  flutter_riverpod: ^2.6.1
  # Routing
  go_router: ^14.8.1
  # File Upload
  file_picker: ^10.3.2
  # PDF Viewer
  syncfusion_flutter_pdfviewer: ^28.2.5
  # UUID
  uuid: ^4.5.1
   # Date Formatting
  intl: ^0.20.2
  # HTTP (for future Llama/Ollama communication if needed)
  http: ^1.3.0

  path: ^1.9.1

  open_filex: ^4.5.0

  path_provider: ^2.1.5

  fl_chart: ^0.69.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true